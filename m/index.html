    @keyframes cs-float-up {
      0% { opacity: 0; transform: translateY(32px) scale(0.95); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes cs-logo-pop {
      0%   { opacity: 0; transform: scale(0.5) rotate(-12deg); }
      60%  { transform: scale(1.1) rotate(4deg); }
      80%  { transform: scale(0.97) rotate(-2deg); }
      100% { opacity: 1; transform: scale(1) rotate(0deg); }
    }
    @keyframes cs-glow-pulse {
      0%, 100% { box-shadow: 0 0 12px 2px #0088cc55, 0 4px 24px 0 #0088cc33; }
      50%       { box-shadow: 0 0 28px 8px #0088ccaa, 0 8px 40px 0 #0088cc66; }
    }
    @keyframes cs-input-glow {
      0%, 100% { box-shadow: 0 0 0 0 transparent; }
      50%       { box-shadow: 0 0 0 3px #6366f144; }
    }
    @keyframes cs-card-hover-rise {
      0%   { transform: translateY(0); box-shadow: none; }
      100% { transform: translateY(-4px); box-shadow: 0 8px 32px #0088cc33; }
    }
    @keyframes cs-orb-drift1 {
      0%, 100% { transform: translate(0,0) scale(1); }
      33%       { transform: translate(40px,-30px) scale(1.08); }
      66%       { transform: translate(-20px,20px) scale(0.95); }
    }
    @keyframes cs-orb-drift2 {
      0%, 100% { transform: translate(0,0) scale(1); }
      50%       { transform: translate(-50px,40px) scale(1.12); }
    }
    @keyframes cs-shimmer {
      0%   { background-position: -200% center; }
      100% { background-position: 200% center; }
    }
    @keyframes cs-badge-pop {
      0%   { opacity: 0; transform: scale(0.7); }
      70%  { transform: scale(1.1); }
      100% { opacity: 1; transform: scale(1); }
    }
    @keyframes cs-feature-stagger {
      0%   { opacity: 0; transform: translateY(16px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    .cs-logo-anim { animation: cs-logo-pop 0.7s cubic-bezier(.34,1.56,.64,1) forwards; }
    .cs-float-up  { animation: cs-float-up 0.55s cubic-bezier(.25,.8,.25,1) both; }
    .cs-connect-btn { animation: cs-glow-pulse 2.4s ease-in-out infinite; transition: transform 0.15s, box-shadow 0.3s; }
    .cs-connect-btn:hover { transform: translateY(-2px) scale(1.025); }
    .cs-shortcut-card { transition: transform 0.22s, box-shadow 0.22s, border-color 0.22s; }
    .cs-shortcut-card:hover { transform: translateY(-3px) scale(1.02); box-shadow: 0 8px 28px #0088cc28; }
    .cs-featured-card { transition: transform 0.28s cubic-bezier(.34,1.56,.64,1), box-shadow 0.28s; }
    .cs-featured-card:hover { transform: translateY(-5px) scale(1.04); box-shadow: 0 12px 40px #0088cc44; }
    .cs-feature-box { animation: cs-feature-stagger 0.5s both; }
    .cs-feature-box:nth-child(1) { animation-delay: 0.05s; }
    .cs-feature-box:nth-child(2) { animation-delay: 0.15s; }
    .cs-feature-box:nth-child(3) { animation-delay: 0.25s; }
    .cs-orb1 { position:fixed; top:-12%; left:-10%; width:55vw; height:55vw; border-radius:50%; background:radial-gradient(circle, #0088cc18 0%, transparent 70%); filter:blur(48px); animation:cs-orb-drift1 14s ease-in-out infinite; pointer-events:none; z-index:0; }
    .cs-orb2 { position:fixed; bottom:-15%; right:-8%; width:50vw; height:50vw; border-radius:50%; background:radial-gradient(circle, #6366f114 0%, transparent 70%); filter:blur(56px); animation:cs-orb-drift2 18s ease-in-out infinite; pointer-events:none; z-index:0; }
    .cs-badge-anim { animation: cs-badge-pop 0.4s 0.3s cubic-bezier(.34,1.56,.64,1) both; }
    .cs-main-card { animation: cs-float-up 0.6s 0.1s both; }
    .cs-title-anim { animation: cs-float-up 0.55s 0.2s both; }
    .cs-input-focus:focus { animation: cs-input-glow 2s ease-in-out infinite; }

@keyframes authOrbDrift1 {
  0%, 100% { transform: translate(0, 0) scale(1); }
  50% { transform: translate(30px, -40px) scale(1.15); }
}
@keyframes authOrbDrift2 {
  0%, 100% { transform: translate(0, 0) scale(1); }
  50% { transform: translate(-25px, 30px) scale(0.9); }
}
@keyframes authOrbDrift3 {
  0%, 100% { transform: translate(0, 0) scale(1); }
  33% { transform: translate(20px, 20px) scale(1.05); }
  66% { transform: translate(-20px, -10px) scale(0.95); }
}
@keyframes authCardIn {
  from { opacity: 0; transform: translateY(40px) scale(0.96); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
@keyframes authIconIn {
  0% { transform: scale(0) rotate(-20deg); opacity: 0; }
  60% { transform: scale(1.1) rotate(5deg); opacity: 1; }
  100% { transform: scale(1) rotate(0); opacity: 1; }
}
@keyframes authIconPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(0,136,204,0.4), 0 8px 32px rgba(0,136,204,0.3); }
  50% { box-shadow: 0 0 0 10px rgba(0,136,204,0), 0 8px 32px rgba(0,136,204,0.5); }
}
@keyframes authTitleIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes authFieldIn {
  from { opacity: 0; transform: translateX(-16px); }
  to { opacity: 1; transform: translateX(0); }
}
@keyframes authBtnGlow {
  0%, 100% { box-shadow: 0 4px 20px rgba(0,136,204,0.35); }
  50% { box-shadow: 0 4px 32px rgba(0,136,204,0.6); }
}
@keyframes authErrorIn {
  from { opacity: 0; transform: translateY(-6px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes authBackIn {
  from { opacity: 0; transform: translateX(-10px); }
  to { opacity: 1; transform: translateX(0); }
}
.auth-orb-1 { animation: authOrbDrift1 10s ease-in-out infinite; }
.auth-orb-2 { animation: authOrbDrift2 13s ease-in-out infinite; }
.auth-orb-3 { animation: authOrbDrift3 9s ease-in-out infinite; }
.auth-card { animation: authCardIn 0.5s cubic-bezier(0.22,1,0.36,1) both 0.1s; }
.auth-icon { animation: authIconIn 0.6s cubic-bezier(0.22,1,0.36,1) both 0.2s, authIconPulse 3s ease-in-out infinite 1s; }
.auth-title { animation: authTitleIn 0.4s cubic-bezier(0.22,1,0.36,1) both 0.35s; }
.auth-field { animation: authFieldIn 0.4s cubic-bezier(0.22,1,0.36,1) both; }
.auth-btn-glow { animation: authBtnGlow 2.5s ease-in-out infinite; }
.auth-error { animation: authErrorIn 0.3s cubic-bezier(0.22,1,0.36,1) both; }

@keyframes mvBackdropIn {
  from { opacity: 0; }
  to { opacity: 1; }
}
@keyframes mvHeaderIn {
  from { opacity: 0; transform: translateY(-16px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes mvControlsIn {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes mvMediaIn {
  from { opacity: 0; transform: scale(0.95); }
  to { opacity: 1; transform: scale(1); }
}
@keyframes mvNavBtnPulse {
  0%, 100% { background: rgba(0,0,0,0.5); }
  50% { background: rgba(0,0,0,0.7); }
}
@keyframes mvSpinnerGlow {
  0%, 100% { box-shadow: 0 0 0 0 rgba(99,102,241,0.4); }
  50% { box-shadow: 0 0 0 8px rgba(99,102,241,0); }
}
@keyframes mvAlbumArtPulse {
  0%, 100% { transform: scale(1); box-shadow: 0 8px 40px rgba(0,136,204,0.3); }
  50% { transform: scale(1.03); box-shadow: 0 12px 60px rgba(0,136,204,0.5); }
}
@keyframes mvCacheStatusIn {
  from { opacity: 0; transform: translateX(-8px); }
  to { opacity: 1; transform: translateX(0); }
}
.mv-backdrop { animation: mvBackdropIn 0.25s ease both; }
.mv-header { animation: mvHeaderIn 0.35s cubic-bezier(0.22,1,0.36,1) both 0.05s; }
.mv-controls { animation: mvControlsIn 0.35s cubic-bezier(0.22,1,0.36,1) both 0.1s; }
.mv-media { animation: mvMediaIn 0.4s cubic-bezier(0.22,1,0.36,1) both 0.05s; }
.mv-spinner { animation: mvSpinnerGlow 1.5s ease-in-out infinite; }
.mv-album-art { animation: mvAlbumArtPulse 3s ease-in-out infinite; }
.mv-cache-status { animation: mvCacheStatusIn 0.3s cubic-bezier(0.22,1,0.36,1) both; }
.mv-ctrl-btn {
  transition: transform 0.15s ease, background 0.2s ease, color 0.2s ease;
}
.mv-ctrl-btn:hover { transform: scale(1.1); }
.mv-ctrl-btn:active { transform: scale(0.9); }
.mv-play-btn {
  transition: transform 0.15s cubic-bezier(0.22,1,0.36,1), background 0.2s ease;
}
.mv-play-btn:hover { transform: scale(1.08); }
.mv-play-btn:active { transform: scale(0.92); }
.mv-nav-btn {
  transition: transform 0.15s ease, opacity 0.2s ease, background 0.2s ease;
}
.mv-nav-btn:hover { background: rgba(0,0,0,0.75) !important; transform: scale(1.08); }
.mv-nav-btn:active { transform: scale(0.93); }

@keyframes miniAudioSlideIn {
  from { transform: translateY(-100%); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}
@keyframes miniAudioBar1 {
  0%, 100% { height: 4px; } 25% { height: 14px; } 75% { height: 8px; }
}
@keyframes miniAudioBar2 {
  0%, 100% { height: 10px; } 40% { height: 20px; } 80% { height: 6px; }
}
@keyframes miniAudioBar3 {
  0%, 100% { height: 6px; } 30% { height: 18px; } 60% { height: 4px; }
}
@keyframes miniAudioBar4 {
  0%, 100% { height: 8px; } 20% { height: 14px; } 70% { height: 10px; }
}
@keyframes miniAudioBar5 {
  0%, 100% { height: 4px; } 50% { height: 20px; } 85% { height: 8px; }
}
@keyframes miniAudioGlow {
  0%, 100% { box-shadow: 0 0 0 0 rgba(99,102,241,0.4); }
  50% { box-shadow: 0 0 0 6px rgba(99,102,241,0); }
}
@keyframes miniAudioNameScroll {
  0%, 20% { transform: translateX(0); }
  80%, 100% { transform: translateX(-30%); }
}
.mini-audio-slide { animation: miniAudioSlideIn 0.4s cubic-bezier(0.22,1,0.36,1) both; }
.mini-audio-bar-1 { animation: miniAudioBar1 0.7s ease-in-out infinite; }
.mini-audio-bar-2 { animation: miniAudioBar2 0.9s ease-in-out infinite 0.1s; }
.mini-audio-bar-3 { animation: miniAudioBar3 0.8s ease-in-out infinite 0.2s; }
.mini-audio-bar-4 { animation: miniAudioBar4 1s ease-in-out infinite 0.05s; }
.mini-audio-bar-5 { animation: miniAudioBar5 0.75s ease-in-out infinite 0.15s; }
.mini-audio-play-btn { transition: transform 0.15s ease, background 0.2s ease; }
.mini-audio-play-btn:hover { transform: scale(1.1); }
.mini-audio-play-btn:active { transform: scale(0.92); }
.mini-audio-play-btn.playing { animation: miniAudioGlow 1.5s ease-in-out infinite; }

      100% { opacity: 1; transform: scale(1) translateY(0); }
    }
    @keyframes us-avatar-ring {
      0%, 100% { box-shadow: 0 0 0 3px #6366f144, 0 0 20px #6366f133; }
      50%       { box-shadow: 0 0 0 6px #6366f100, 0 0 40px #6366f166; }
    }
    @keyframes us-tab-slide {
      0%   { opacity: 0; transform: translateX(12px); }
      100% { opacity: 1; transform: translateX(0); }
    }
    @keyframes us-section-rise {
      0%   { opacity: 0; transform: translateY(14px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes us-save-glow {
      0%, 100% { box-shadow: 0 0 10px 2px #6366f155; }
      50%       { box-shadow: 0 0 24px 6px #6366f199; }
    }
    @keyframes us-tab-indicator {
      0%   { transform: scaleX(0); opacity: 0; }
      100% { transform: scaleX(1); opacity: 1; }
    }
    @keyframes us-orb-drift {
      0%, 100% { transform: translate(0,0) scale(1); }
      50%       { transform: translate(20px,-15px) scale(1.06); }
    }
    @keyframes us-color-pop {
      0%   { transform: scale(0); opacity: 0; }
      70%  { transform: scale(1.15); }
      100% { transform: scale(1); opacity: 1; }
    }
    .us-modal      { animation: us-modal-in 0.45s cubic-bezier(.25,.8,.25,1) both; }
    .us-avatar     { animation: us-avatar-ring 2.8s ease-in-out infinite; }
    .us-tab-content { animation: us-tab-slide 0.3s cubic-bezier(.25,.8,.25,1) both; }
    .us-section    { animation: us-section-rise 0.4s both; }
    .us-section:nth-child(1) { animation-delay: 0.05s; }
    .us-section:nth-child(2) { animation-delay: 0.12s; }
    .us-section:nth-child(3) { animation-delay: 0.19s; }
    .us-save-btn   { animation: us-save-glow 2.2s ease-in-out infinite; transition: transform 0.18s; }
    .us-save-btn:hover { transform: translateY(-2px) scale(1.03); }
    .us-tab-btn    { transition: color 0.2s, background 0.2s; position: relative; }
    .us-tab-btn::after { content:''; position:absolute; bottom:0; left:0; right:0; height:2px; background:#818cf8; transform:scaleX(0); transition:transform 0.25s cubic-bezier(.34,1.56,.64,1); transform-origin:center; }
    .us-tab-btn.active::after { transform:scaleX(1); }
    .us-input-field { transition: border-color 0.2s, box-shadow 0.2s; }
    .us-input-field:focus { box-shadow: 0 0 0 3px #6366f133; }
    .us-color-swatch { animation: us-color-pop 0.3s cubic-bezier(.34,1.56,.64,1) both; }
    .us-color-swatch:hover { transform: scale(1.2); transition: transform 0.18s cubic-bezier(.34,1.56,.64,1); }
    .us-close-btn  { transition: transform 0.18s, color 0.15s; }
    .us-close-btn:hover { transform: rotate(90deg) scale(1.1); }

    @keyframes co-fade-in {
      0%   { opacity: 0; transform: scale(0.96); }
      100% { opacity: 1; transform: scale(1); }
    }
    @keyframes co-ring-expand {
      0%   { transform: scale(0.85); opacity: 0.9; }
      70%  { transform: scale(1.3); opacity: 0.1; }
      100% { transform: scale(1.5); opacity: 0; }
    }
    @keyframes co-avatar-breathe {
      0%, 100% { box-shadow: 0 0 0 0 #22c55e55, 0 8px 40px #0088cc55; }
      50%       { box-shadow: 0 0 0 18px #22c55e00, 0 12px 60px #0088ccaa; }
    }
    @keyframes co-avatar-ring-breathe {
      0%, 100% { box-shadow: 0 0 0 0 #0088cc55, 0 8px 40px #0088cc55; }
      50%       { box-shadow: 0 0 0 18px #0088cc00, 0 12px 60px #0088ccaa; }
    }
    @keyframes co-btn-ripple {
      0%   { box-shadow: 0 0 0 0 currentColor; }
      70%  { box-shadow: 0 0 0 14px transparent; }
      100% { box-shadow: 0 0 0 0 transparent; }
    }
    @keyframes co-slide-up {
      0%   { opacity: 0; transform: translateY(40px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes co-dots {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
      40%            { transform: scale(1); opacity: 1; }
    }
    @keyframes co-signal-wave {
      0%, 100% { opacity: 0.3; transform: scaleY(0.5); }
      50%       { opacity: 1; transform: scaleY(1); }
    }
    @keyframes co-timer-glow {
      0%, 100% { text-shadow: 0 0 8px #22c55e66; }
      50%       { text-shadow: 0 0 20px #22c55ecc; }
    }
    @keyframes co-bg-pulse {
      0%, 100% { background-position: 0% 50%; }
      50%       { background-position: 100% 50%; }
    }
    .co-screen      { animation: co-fade-in 0.45s cubic-bezier(.25,.8,.25,1) both; }
    .co-ring-1      { animation: co-ring-expand 1.8s ease-out infinite; }
    .co-ring-2      { animation: co-ring-expand 1.8s ease-out 0.3s infinite; }
    .co-ring-3      { animation: co-ring-expand 1.8s ease-out 0.6s infinite; }
    .co-avatar-call { animation: co-avatar-breathe 2.2s ease-in-out infinite; }
    .co-avatar-active { animation: co-avatar-ring-breathe 2.8s ease-in-out infinite; }
    .co-controls    { animation: co-slide-up 0.5s 0.15s cubic-bezier(.25,.8,.25,1) both; }
    .co-call-btn    { transition: transform 0.18s cubic-bezier(.34,1.56,.64,1), box-shadow 0.18s; }
    .co-call-btn:hover { transform: scale(1.12); }
    .co-call-btn:active { transform: scale(0.94); }
    .co-decline-btn { animation: co-btn-ripple 2.5s ease-out infinite; color: #ef4444; }
    .co-accept-btn  { animation: co-btn-ripple 1.4s ease-out infinite; color: #22c55e; }
    .co-timer       { animation: co-timer-glow 2s ease-in-out infinite; }
    .co-name        { animation: co-slide-up 0.45s 0.1s both; }
    .co-status      { animation: co-slide-up 0.45s 0.2s both; }

    .co-pip:hover   { transform: scale(1.05); }

@keyframes ytBackdropIn {
  from { opacity: 0; backdrop-filter: blur(0px); }
  to { opacity: 1; backdrop-filter: blur(12px); }
}
@keyframes ytPlayerIn {
  from { opacity: 0; transform: scale(0.92) translateY(20px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}
@keyframes ytCloseIn {
  from { opacity: 0; transform: translateY(-12px) scale(0.8); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
@keyframes ytControlsIn {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes ytPlayBtnPulse {
  0%, 100% { box-shadow: 0 4px 20px rgba(220,38,38,0.5), 0 0 0 0 rgba(220,38,38,0.4); }
  50% { box-shadow: 0 4px 30px rgba(220,38,38,0.7), 0 0 0 10px rgba(220,38,38,0); }
}
@keyframes ytPreviewHover {
  from { opacity: 0; }
  to { opacity: 1; }
}
@keyframes ytThumbnailShimmer {
  0% { background-position: -200% 0; }
  100% { background-position: 200% 0; }
}
.yt-backdrop { animation: ytBackdropIn 0.3s ease both; }
.yt-player { animation: ytPlayerIn 0.45s cubic-bezier(0.22,1,0.36,1) both 0.05s; }
.yt-close { animation: ytCloseIn 0.35s cubic-bezier(0.22,1,0.36,1) both 0.15s; }
.yt-controls { animation: ytControlsIn 0.35s cubic-bezier(0.22,1,0.36,1) both 0.25s; }
.yt-play-btn-pulse { animation: ytPlayBtnPulse 2s ease-in-out infinite; }
.yt-ctrl-btn {
  transition: transform 0.15s ease, background 0.2s ease;
}
.yt-ctrl-btn:hover { transform: scale(1.1); }
.yt-ctrl-btn:active { transform: scale(0.9); }

@keyframes stickerPickerIn {
  from { opacity: 0; transform: scale(0.92) translateY(10px); transform-origin: bottom right; }
  to { opacity: 1; transform: scale(1) translateY(0); transform-origin: bottom right; }
}
@keyframes stickerItemIn {
  from { opacity: 0; transform: scale(0.7); }
  to { opacity: 1; transform: scale(1); }
}
@keyframes stickerModalIn {
  from { opacity: 0; transform: scale(0.9); }
  to { opacity: 1; transform: scale(1); }
}
@keyframes stickerBackdropIn {
  from { opacity: 0; }
  to { opacity: 1; }
}
@keyframes stickerEmptyBounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-6px); }
}
@keyframes stickerHoverPop {
  0% { transform: scale(1); }
  50% { transform: scale(1.15); }
  100% { transform: scale(1); }
}

.sticker-backdrop-in { animation: stickerBackdropIn 0.2s ease both; }
.sticker-empty-icon { animation: stickerEmptyBounce 2s ease-in-out infinite; }
.sticker-btn {
  transition: transform 0.18s cubic-bezier(0.22,1,0.36,1), background 0.15s ease;
}
.sticker-btn:hover { transform: scale(1.12); }
.sticker-btn:active { transform: scale(0.92); }

@keyframes notifSlideIn {
  from { opacity: 0; transform: translateX(110%) scale(0.92); }
  to { opacity: 1; transform: translateX(0) scale(1); }
}
@keyframes notifSlideOut {
  from { opacity: 1; transform: translateX(0) scale(1); max-height: 80px; margin-bottom: 8px; }
  to { opacity: 0; transform: translateX(110%) scale(0.92); max-height: 0; margin-bottom: 0; }
}
@keyframes notifIconPop {
  0% { transform: scale(0) rotate(-30deg); }
  60% { transform: scale(1.25) rotate(5deg); }
  100% { transform: scale(1) rotate(0deg); }
}
@keyframes notifProgress {
  from { width: 100%; }
  to { width: 0%; }
}
@keyframes notifGlow {
  0%, 100% { opacity: 0.6; }
  50% { opacity: 1; }
}
.notif-slide-in { animation: notifSlideIn 0.4s cubic-bezier(0.22,1,0.36,1) both; }
.notif-slide-out { animation: notifSlideOut 0.35s cubic-bezier(0.55,0,1,0.45) both; }
.notif-icon-pop { animation: notifIconPop 0.5s 0.15s cubic-bezier(0.22,1,0.36,1) both; }
